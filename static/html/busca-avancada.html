<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização do Documento - RAG</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* CSS Específico para o Layout Dividido (PDF + Chat) */
        .rag-container {
            display: flex;
            height: calc(100vh - 100px); /* Ajuste para caber na tela sem scroll duplo */
            gap: 20px;
            padding: 20px;
        }

        .pdf-preview-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-section {
            width: 450px; /* Largura fixa para o chat */
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .pdf-embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        /* Classes de Mensagem */
        .message { margin-bottom: 15px; }
        .message-user { text-align: right; }
        .message-bot { text-align: left; }
        
        .message-content {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 85%;
            text-align: left;
        }
        
        .message-user .message-content {
            background: #e63946;
            color: white;
        }
        
        .message-bot .message-content {
            background: #e9ecef;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/index" class="back-button-top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #333; font-weight: bold;">
            <span>⬅️</span> Voltar para Busca
        </a>
        <h2 id="docTitle" style="margin-left: 20px;">Carregando documento...</h2>
    </div>

    <div class="rag-container">
        <div class="pdf-preview-section" id="pdfContainer">
            <p style="text-align:center; margin-top: 50%;">Carregando PDF...</p>
        </div>

        <div class="chat-section">
            <div class="chat-header" style="padding: 15px; border-bottom: 1px solid #eee;">
                <h3 style="margin:0; color: #e63946;">🤖 Assistente Jurídico</h3>
                <p style="margin:5px 0 0 0; font-size: 0.8rem; color: #666;">Pergunte sobre este contrato</p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message message-bot">
                    <div class="message-content">
                        Olá! Estou analisando este documento. O que você gostaria de saber sobre ele?
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea id="chatInput" placeholder="Ex: Qual o valor do contrato?" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; resize: none;"></textarea>
                <button onclick="enviarPergunta()" class="btn-primary" style="width: 100%; margin-top: 10px;">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let documentoAtualId = null;

        // 1. Pega o ID da URL (?doc=123)
        function getDocIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('doc');
        }

        // 2. Inicializa a página
        async function carregarPagina() {
            const docId = getDocIdFromURL();
            if (!docId) {
                alert('Documento não especificado.');
                window.location.href = '/index';
                return;
            }
            documentoAtualId = docId;

            // Busca metadados do documento
            try {
                const response = await fetch(`${API_BASE_URL}/documento/${docId}`);
                if (response.ok) {
                    const doc = await response.json();
                    document.getElementById('docTitle').textContent = doc.nome_arquivo;
                }
            } catch (e) {
                console.error("Erro ao buscar detalhes", e);
            }

            // Carrega o PDF no iframe
            const pdfUrl = `${API_BASE_URL}/documento/${docId}/pdf`;
            document.getElementById('pdfContainer').innerHTML = `
                <iframe src="${pdfUrl}" class="pdf-embed"></iframe>
            `;

            // Processa o documento no RAG (Backend)
            // Isso garante que o RAG já "leu" o texto quando o usuário perguntar
            fetch(`${API_BASE_URL}/rag/processar/${docId}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => console.log("RAG processado:", data))
                .catch(err => console.error("Erro RAG:", err));
        }

        // 3. Envia pergunta para o Chat
        async function enviarPergunta() {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto) return;

            // Adiciona mensagem do usuário
            adicionarMensagem('user', texto);
            input.value = '';

            // Loading
            adicionarMensagem('bot', 'Analizando...');

            try {
                const response = await fetch(`${API_BASE_URL}/rag/perguntar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_doc: parseInt(documentoAtualId),
                        pergunta: texto
                    })
                });

                const data = await response.json();
                
                // Remove loading (última mensagem)
                const chatMsgs = document.getElementById('chatMessages');
                chatMsgs.lastElementChild.remove();

                // Adiciona resposta
                adicionarMensagem('bot', data.resposta);

            } catch (error) {
                console.error(error);
                const chatMsgs = document.getElementById('chatMessages');
                chatMsgs.lastElementChild.remove();
                adicionarMensagem('bot', 'Desculpe, ocorreu um erro ao processar sua pergunta.');
            }
        }

        function adicionarMensagem(tipo, texto) {
            const div = document.createElement('div');
            div.className = `message message-${tipo}`;
            div.innerHTML = `<div class="message-content">${texto}</div>`;
            document.getElementById('chatMessages').appendChild(div);
            // Scroll para baixo
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        // Enter envia mensagem
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarPergunta();
            }
        });

        // Inicia
        window.addEventListener('load', carregarPagina);
    </script>
</body>
</html>
